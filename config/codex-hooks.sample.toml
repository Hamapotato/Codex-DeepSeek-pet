# 追加到 ~/.codex/config.toml（或 %CODEX_HOME%\config.toml）。
#
# 推荐直接运行 `node install/apply-hooks.js`：它会用当前机器上的真实
# node 路径和项目路径生成同内容的块，并带起止标记，可重复执行。
#
# 手写时注意：
#   - 路径用正斜杠，避免 TOML 转义；
#   - 路径含空格时用 \" 包起来（本文件的 command 已是转义后的写法）；
#   - 首次运行 Codex 会提示 “Hooks need review”，选 “Trust all and continue”，
#     或在 /hooks 里按 t 信任；改了命令或 timeout 后需要重新信任。

[[hooks.SessionStart]]
hooks = [
  { type = "command", command = "\"<NODE_EXE>\" \"<PROJECT_DIR>/hook.js\"", timeout = 10, async = true },
]

[[hooks.UserPromptSubmit]]
hooks = [
  { type = "command", command = "\"<NODE_EXE>\" \"<PROJECT_DIR>/hook.js\"", timeout = 10 },
]

[[hooks.PostToolUse]]
hooks = [
  { type = "command", command = "\"<NODE_EXE>\" \"<PROJECT_DIR>/hook.js\"", timeout = 10, async = true },
]

[[hooks.PermissionRequest]]
hooks = [
  { type = "command", command = "\"<NODE_EXE>\" \"<PROJECT_DIR>/hook.js\"", timeout = 10 },
]

[[hooks.Stop]]
hooks = [
  { type = "command", command = "\"<NODE_EXE>\" \"<PROJECT_DIR>/hook.js\"", timeout = 10 },
]

[[hooks.Interrupt]]
hooks = [
  { type = "command", command = "\"<NODE_EXE>\" \"<PROJECT_DIR>/hook.js\"", timeout = 10 },
]
